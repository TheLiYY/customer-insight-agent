# =============================================================================
# 容器内的 Nginx 站点配置（被 official nginx 镜像的 http {} 包含）
#   /            → /usr/share/nginx/html（dist 已由构建阶段拷入）
#   /assets/*    → 强缓存 1 年
#   /api/*       → api 容器（docker compose 内部 DNS）
# 本地调试时若没有 docker，可把 upstream 换成 127.0.0.1:8000、
# root 换成 dist 的绝对路径，用 nginx -p ... -c ... -t 做语法检查。
# =============================================================================

upstream customer_insight_api {
    server api:8000;
    keepalive 16;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 8m;

    # 前端 bundle 约 1.2MB，压缩后 ~405KB
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 入口不缓存：发新版本后刷新即拿到新 bundle
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API：路径原样透传
    location /api/ {
        proxy_pass         http://customer_insight_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
    }

    # Swagger / OpenAPI（Apifox 导入用）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://customer_insight_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Nginx 自身探活（容器 HEALTHCHECK 用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 单页应用：未知路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
