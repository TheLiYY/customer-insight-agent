# CustLens 公网演示配置（端口 8090，默认不验口令，靠限流兜底）
#
# 与 deploy/nginx.conf 的区别：
#   1) 换端口 8090，方便和内网 8080 并存；
#   2) 默认不要求口令（浏览器打开即用），因为 basic auth 在子资源上会反复弹框；
#      需要口令时把下面 auth_basic 两行取消注释，并用 openssl 生成 deploy\.htpasswd；
#   3) 对上传接口限流，防止公网被刷。
#
# 启动：
#   New-Item -ItemType Directory -Force logs, temp\client_body_temp, temp\proxy_temp, temp\fastcgi_temp, temp\uwsgi_temp, temp\scgi_temp
#   nginx.exe -p <nginx 前缀> -c D:\projects\customer-insight-agent\deploy\nginx.public.conf

worker_processes auto;

error_log logs/error-public.log warn;
pid       logs/nginx-public.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 24m;   # 演示环境限制到 24MB，够 8 万行左右订单

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json text/javascript application/javascript;

    # 上传接口限流：每分钟 6 次，突发 3
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=6r/m;

    upstream custlens_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen      8090;
        server_name _;

        root  D:/projects/customer-insight-agent/frontend/dist;
        index index.html;

        # 需要口令时打开这两行
        # auth_basic           "CustLens Demo";
        # auth_basic_user_file D:/projects/customer-insight-agent/deploy/.htpasswd;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # 上传/应用数据这两个重接口限流
        location ~ ^/api/import/(inspect|apply)$ {
            limit_req  zone=uploads burst=3 nodelay;
            proxy_pass         http://custlens_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            proxy_pass         http://custlens_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass       http://custlens_api;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
