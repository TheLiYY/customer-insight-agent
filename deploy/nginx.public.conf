# CustLens 公网演示配置（与 deploy/nginx.conf 的区别：加了访问口令 + 换端口 8090）
#
# 用途：把本机的前端 + 后端通过 cloudflared 之类的内网穿透暴露到公网时用。
# 启动：
#   New-Item -ItemType Directory -Force logs, temp\client_body_temp, temp\proxy_temp, temp\fastcgi_temp, temp\uwsgi_temp, temp\scgi_temp
#   nginx.exe -p <nginx 前缀目录> -c D:\projects\customer-insight-agent\deploy\nginx.public.conf
#
# 口令文件 deploy\.htpasswd 由下面的命令生成（该文件不入库）：
#   openssl passwd -apr1 <你的密码> > deploy\.htpasswd
#   口令文件格式： demo:$apr1$xxxx$yyyy

worker_processes auto;

error_log logs/error-public.log warn;
pid       logs/nginx-public.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;   # 上传客户表用，与后端 MAX_BYTES 一致

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json text/javascript application/javascript;

    upstream custlens_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen      8090;
        server_name _;

        root  D:/projects/customer-insight-agent/frontend/dist;
        index index.html;

        # 整个站点要口令；健康检查放开，方便穿透平台探活
        auth_basic           "CustLens Demo";
        auth_basic_user_file D:/projects/customer-insight-agent/deploy/.htpasswd;

        location = /healthz {
            auth_basic off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location /api/ {
            proxy_pass         http://custlens_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;   # 大文件解析 + 全量重算会慢
        }

        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass       http://custlens_api;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
