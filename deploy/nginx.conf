# ============================================================================
# Customer Insight Agent —— 前端静态站点 + /api 反向代理（Nginx）
#
# 用法（Windows）：
#   nginx -p D:/projects/customer-insight-agent/deploy -c nginx.conf
# 用法（Linux）：
#   sudo cp nginx.conf /etc/nginx/conf.d/customer-insight.conf && sudo nginx -t && sudo systemctl reload nginx
# 详细步骤见 deploy/README.md
#
# 前端 dist 与后端（FastAPI :8000）是分开部署的：
#   - 浏览器只访问 Nginx（:80 或 :8080）
#   - 静态资源由 Nginx 直接从 frontend/dist 读取
#   - /api/* 反代到后端，浏览器看到的是同源请求，不需要 CORS
# ============================================================================

worker_processes auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # 不读系统 mime.types，避免「-p 前缀目录」下找不到文件的报错
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
    }
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 8m;

    # 前端 bundle 约 1.2MB，开 gzip 后 ~405KB
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 后端只有一个进程组；keepalive 减少反代握手
    upstream customer_insight_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen       8080;
        server_name  localhost;

        # ↓↓↓ 部署前把这里改成你机器的 dist 绝对路径（Windows 也用正斜杠）↓↓↓
        root   D:/projects/customer-insight-agent/frontend/dist;
        index  index.html;

        # 入口不缓存，保证发版后刷新就能拿到新 bundle
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # 带 hash 的静态资源可以长期缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 后端 API：路径原样透传（/api/health → 127.0.0.1:8000/api/health）
        location /api/ {
            proxy_pass         http://customer_insight_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }

        # Swagger / OpenAPI / Apifox 导入用的地址也交给后端
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass         http://customer_insight_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Nginx 自身健康检查（和后端 /api/health 区分开）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # 前端是单页应用：未知路径一律回落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
