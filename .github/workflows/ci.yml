name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端冒烟测试（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 准备数据（离线可用内置样例）
        run: python scripts/prepare_data.py

      - name: 冒烟测试（21 个接口/对话用例）
        run: python backend/tests/smoke_test.py

      - name: 契约层测试（52 项，验证换数据后字段识别）
        run: python backend/tests/test_contract.py

      - name: 换数据降级验证（Mall Customers，无金额/无响应标签）
        continue-on-error: true   # 依赖 jsDelivr 网络，失败不阻塞
        run: |
          python scripts/prepare_data.py --dataset mall --refresh
          python backend/tests/smoke_test.py
          python scripts/prepare_data.py --refresh

      - name: 导出分析报告（验证 xlsx 生成链路）
        run: python scripts/export_report.py

      - name: 导出 OpenAPI / Postman（验证接口定义可生成）
        run: python scripts/export_openapi.py

  frontend:
    name: 前端构建（Node 20）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生产构建
        run: npx vite build

  docker:
    name: Docker 部署校验
    runs-on: ubuntu-latest
    # 本机没有 Docker，镜像构建未在本地验证过；先在 CI 上跑通再决定是否设为阻塞项。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置
        run: docker compose config -q

      - name: 构建后端镜像
        run: docker build -f deploy/Dockerfile.api -t customer-insight-api:test .

      - name: 构建前端镜像
        run: docker build -f deploy/Dockerfile.web -t customer-insight-web:test .

      - name: 构建单容器镜像（Render/云平台部署用）
        run: docker build -f deploy/Dockerfile.app -t custlens-app:test .

      - name: 起容器并探活
        run: |
          cp deploy/docker-compose.bundle.yml docker-compose.ci.yml
          sed -i 's#customer-insight-api:1.0.0#customer-insight-api:test#; s#customer-insight-web:1.0.0#customer-insight-web:test#' docker-compose.ci.yml
          docker compose -f docker-compose.ci.yml up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "后端健康检查通过"; break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/ | head -n 5
          curl -fsS http://localhost:8080/api/insights | head -c 200
          docker compose -f docker-compose.ci.yml down -v
